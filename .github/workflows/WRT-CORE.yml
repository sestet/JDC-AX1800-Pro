#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_WIFI_OPEN:
        required: false
        type: boolean
        default: false
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_COMMIT:
        required: false
        type: string
        default: ''
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: boolean
        default: false
      WRT_USE_GENERAL:
        required: false
        type: boolean
        default: true
      WRT_PACKAGE_PROFILE:
        required: false
        type: string
        default: general
    secrets:
      WRT_WIFI_PASSWORD:
        required: false

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{secrets.WRT_WIFI_PASSWORD || inputs.WRT_WORD}}
  WRT_WIFI_OPEN: ${{inputs.WRT_WIFI_OPEN}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_COMMIT: ${{inputs.WRT_COMMIT}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_USE_GENERAL: ${{inputs.WRT_USE_GENERAL}}
  WRT_PACKAGE_PROFILE: ${{inputs.WRT_PACKAGE_PROFILE}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev libncurses-dev libncurses6 squashfs-tools
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          if [[ -n "$WRT_COMMIT" ]]; then
            cd ./wrt/
            git fetch --depth=1 origin "$WRT_COMMIT"
            git checkout --detach FETCH_HEAD
            cd $GITHUB_WORKSPACE
          fi

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # 修改软件源为IPK（2026.06.28新增部分）
          #sed -i 's/.apk/.ipk/g' feeds.conf.default
          sed -i 's/\.apk/.ipk/g' feeds.conf.default
         
          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          case "$WRT_PACKAGE_PROFILE" in
            arthur)
              $GITHUB_WORKSPACE/Scripts/Packages-arthur.sh
              ;;
            general|'')
              $GITHUB_WORKSPACE/Scripts/Packages.sh
              $GITHUB_WORKSPACE/Scripts/Handles.sh
              ;;
            *)
              echo "Unknown package profile: $WRT_PACKAGE_PROFILE" >&2
              exit 1
              ;;
          esac

      - name: Custom Settings
        run: |
          cd ./wrt/

          # ===== 修复 node-pnpm 因上游文件布局变化导致的 cp 失败 =====
          #$GITHUB_WORKSPACE/Scripts/node-pnpm-patch.sh

          if [[ "${WRT_CONFIG,,}" == *"test"* || "$WRT_USE_GENERAL" != 'true' ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          
          # ==== Ensure netfilter packaging conflict is fixed for Linux 6.18 ====
          $GITHUB_WORKSPACE/Scripts/fix-netfilter.sh || echo "[WARN] fix-netfilter.sh failed, continuing..."        
          
          # ==== 修复文件冲突（集中脚本）
          #$GITHUB_WORKSPACE/Scripts/iptable.sh
      
          # 清理旧的 target 构建产物，确保新的 Makefile/CONFLICTS 生效
          #echo "Cleaning old build artifacts to avoid using stale packages/artifacts..."
          #rm -rf ./build_dir/target-* ./staging_dir/target-* ./bin/packages/* ./bin/targets/* ./tmp/* || true
          # 可选：如需强制重新下载包，取消下面一行的注释（会清空 dl/，需自行权衡）
          # rm -rf ./dl/*
          
          make defconfig -j$(nproc)

          if [[ "$WRT_TEST" == 'true' ]]; then
            cp .config "$GITHUB_WORKSPACE/Config-$WRT_CONFIG-$WRT_HASH.txt"
          fi

      - name: Validate Arthur Target and Packages
        if: env.WRT_PACKAGE_PROFILE == 'arthur'
        run: |
          cd ./wrt/

          EXPECTED_DEVICE='CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y'
          EXPECTED_PROFILE='CONFIG_TARGET_PROFILE="DEVICE_jdcloud_re-ss-01"'
          SELECTED_DEVICES="$(grep -cE '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_.*=y$' .config || true)"

          if ! grep -qxF "$EXPECTED_DEVICE" .config || \
             ! grep -qxF "$EXPECTED_PROFILE" .config || \
             [ "$SELECTED_DEVICES" -ne 1 ]; then
            echo "::error::Arthur build did not resolve exclusively to JDCloud RE-SS-01"
            grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=|^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_.*=y$' .config || true
            exit 1
          fi

          FWTOOL_SH='./package/base-files/files/lib/upgrade/fwtool.sh'
          FWTOOL_FIXED='if { [ "${devicecompat#.*}" != "${imagecompat#.*}" ] || [ "$dev" = "$oem" ]; } && [ "$SAVE_CONFIG" = "1" ]; then'
          grep -qF "$FWTOOL_FIXED" "$FWTOOL_SH" || {
            echo "::error::The fwtool compatibility-check fix is missing"
            exit 1
          }

          OPENCLASH_CORE='./package/luci-app-openclash/root/etc/openclash/core/clash_meta'
          [ -x "$OPENCLASH_CORE" ] || {
            echo "::error::The pinned OpenClash core is missing or not executable"
            exit 1
          }

          for DUPLICATE_OPENCLASH in \
            './package/feeds/luci/luci-app-openclash' \
            './feeds/luci/applications/luci-app-openclash'; do
            if [ -e "$DUPLICATE_OPENCLASH" ] || [ -L "$DUPLICATE_OPENCLASH" ]; then
              echo "::error::A duplicate feeds OpenClash package remains: $DUPLICATE_OPENCLASH"
              exit 1
            fi
          done

          MISSING_PACKAGE=0
          while IFS= read -r PACKAGE_CONFIG; do
            if grep -qxF "$PACKAGE_CONFIG" .config; then
              continue
            fi

            PACKAGE_NAME="${PACKAGE_CONFIG#CONFIG_PACKAGE_}"
            PACKAGE_NAME="${PACKAGE_NAME%=y}"
            echo "::error::Requested package was not selected: $PACKAGE_CONFIG"
            grep -E "^(CONFIG_PACKAGE_${PACKAGE_NAME}=|# CONFIG_PACKAGE_${PACKAGE_NAME} is not set)" .config || true
            grep -n -A20 -B3 -F "config PACKAGE_$PACKAGE_NAME" tmp/.config-package.in || true
            MISSING_PACKAGE=1
          done < <(grep -E '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$' "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt")

          [ "$MISSING_PACKAGE" -eq 0 ]

          SELECTED_THEMES="$(sed -n 's/^CONFIG_PACKAGE_\(luci-theme-[^=]*\)=y$/\1/p' .config)"
          if [ "$SELECTED_THEMES" != 'luci-theme-argon' ]; then
            echo "::error::Arthur must contain only the Argon LuCI theme"
            printf '%s\n' "$SELECTED_THEMES"
            exit 1
          fi

      - name: Clean Build Artifacts
        run: |
          cd ./wrt/
          make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Validate Arthur Firmware Contents
        if: env.WRT_PACKAGE_PROFILE == 'arthur' && env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          SYSUPGRADE="$(find ./bin/targets/ -type f -name '*jdcloud_re-ss-01-squashfs-sysupgrade*.bin' -print -quit)"
          MANIFEST="$(find ./bin/targets/ -type f -name '*jdcloud_re-ss-01*.manifest' -print -quit)"
          [ -n "$SYSUPGRADE" ] && [ -n "$MANIFEST" ] || {
            echo "::error::Arthur sysupgrade image or manifest was not generated"
            exit 1
          }

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT INT TERM
          tar -xf "$SYSUPGRADE" -C "$TEMP_DIR"
          ROOTFS="$(find "$TEMP_DIR" -type f -name root -print -quit)"
          [ -n "$ROOTFS" ] || {
            echo "::error::Arthur SquashFS root was not found in the sysupgrade image"
            exit 1
          }

          CORE_LINE="$(unsquashfs -ll "$ROOTFS" 2>/dev/null | grep '/etc/openclash/core/clash_meta$' || true)"
          case "$CORE_LINE" in
            -rwx*) ;;
            *)
              echo "::error::The final Arthur image does not contain an executable OpenClash core"
              exit 1
              ;;
          esac

          OPENCLASH_VERSION="$(sed -n 's/^PKG_VERSION:=//p' ./package/luci-app-openclash/Makefile | head -n 1)"
          grep -qF "luci-app-openclash - $OPENCLASH_VERSION" "$MANIFEST" || {
            echo "::error::The final image did not use the pinned OpenClash package"
            exit 1
          }

          for REQUIRED_PACKAGE in \
            luci-theme-argon luci-app-argon-config luci-ssl-openssl px5g-openssl \
            luci-app-openclash luci-app-mwan3 luci-app-travelmate \
            luci-app-cloudflared luci-app-store luci-app-diskman luci-app-ksmbd \
            luci-app-aria2 kmod-qca-nss-drv kmod-qca-nss-ecm kmod-usb-net-rndis; do
            grep -q "^${REQUIRED_PACKAGE} - " "$MANIFEST" || {
              echo "::error::The final Arthur image is missing $REQUIRED_PACKAGE"
              exit 1
            }
          done

          INSTALLED_THEMES="$(sed -n 's/^\(luci-theme-[^ ]*\) - .*/\1/p' "$MANIFEST")"
          if [ "$INSTALLED_THEMES" != 'luci-theme-argon' ]; then
            echo "::error::The final Arthur image must contain only the Argon LuCI theme"
            printf '%s\n' "$INSTALLED_THEMES"
            exit 1
          fi

          LAN_DEFAULT="lan) ipad=\${ipaddr:-\"$WRT_IP\"} ;;"
          CONFIG_GENERATE="$(unsquashfs -cat "$ROOTFS" bin/config_generate)"
          grep -qF "$LAN_DEFAULT" <<< "$CONFIG_GENERATE" || {
            echo "::error::The final Arthur image has the wrong LAN address"
            exit 1
          }
          grep -qF "set system.@system[-1].hostname='$WRT_NAME'" <<< "$CONFIG_GENERATE" || {
            echo "::error::The final Arthur image has the wrong hostname"
            exit 1
          }

          DHCP_CONFIG="$(unsquashfs -cat "$ROOTFS" etc/config/dhcp)"
          grep -Eq "^[[:space:]]*option domain[[:space:]]+'lan'[[:space:]]*$" <<< "$DHCP_CONFIG" || {
            echo "::error::The final Arthur image does not provide the expected .lan local domain"
            exit 1
          }

          WIFI_DEFAULTS="$(unsquashfs -cat "$ROOTFS" lib/wifi/mac80211.uc)"
          grep -qF "set \${si}.ssid='$WRT_SSID'" <<< "$WIFI_DEFAULTS" || {
            echo "::error::The final Arthur image has the wrong Wi-Fi SSID"
            exit 1
          }
          if [[ "$WRT_WIFI_OPEN" == 'true' ]]; then
            if ! grep -qF "set \${si}.encryption='none'" <<< "$WIFI_DEFAULTS" || \
               ! grep -qF "set \${si}.key=''" <<< "$WIFI_DEFAULTS" || \
               ! grep -qF "set \${si}.disabled='0'" <<< "$WIFI_DEFAULTS"; then
              echo "::error::The final Arthur image does not use the expected open Wi-Fi defaults"
              exit 1
            fi
          else
            if ! grep -qF "set \${si}.encryption='psk2+ccmp'" <<< "$WIFI_DEFAULTS" || \
               ! grep -qF "set \${si}.key='$WRT_WORD'" <<< "$WIFI_DEFAULTS" || \
               ! grep -qF "set \${si}.disabled='0'" <<< "$WIFI_DEFAULTS"; then
              echo "::error::The final Arthur image does not use the expected WPA2 Wi-Fi defaults"
              exit 1
            fi
          fi

          UHTTPD_CONFIG="$(unsquashfs -cat "$ROOTFS" etc/config/uhttpd)"
          UHTTPD_NORMALIZED="$(sed -E 's/^[[:space:]]+//; s/[[:space:]]+/ /g; s/[[:space:]]+$//' <<< "$UHTTPD_CONFIG")"
          for LISTENER in \
            'list listen_http 0.0.0.0:80' \
            'list listen_http [::]:80' \
            'list listen_https 0.0.0.0:443' \
            'list listen_https [::]:443'; do
            grep -qxF "$LISTENER" <<< "$UHTTPD_NORMALIZED" || {
              echo "::error::The final Arthur image is missing uhttpd listener: $LISTENER"
              exit 1
            }
          done
          grep -Eq '^[[:space:]]*option redirect_https[[:space:]]+0[[:space:]]*$' <<< "$UHTTPD_CONFIG" || {
            echo "::error::The final Arthur image unexpectedly redirects HTTP to HTTPS"
            exit 1
          }

          if unsquashfs -ll "$ROOTFS" 2>/dev/null | grep -Eq '/etc/uhttpd\.(key|crt)$'; then
            echo "::error::The final Arthur image contains a pre-generated HTTPS private key or certificate"
            exit 1
          fi

          ARGON_DEFAULTS="$(unsquashfs -cat "$ROOTFS" etc/uci-defaults/30_luci-theme-argon)"
          grep -qF 'set luci.main.mediaurlbase=/luci-static/argon' <<< "$ARGON_DEFAULTS" || {
            echo "::error::Argon is not configured as the default LuCI theme"
            exit 1
          }

          CLOUDFLARED_MENU="$(unsquashfs -cat "$ROOTFS" usr/share/luci/menu.d/luci-app-cloudflared.json)"
          if ! grep -qF 'admin/vpn/cloudflared' <<< "$CLOUDFLARED_MENU" || \
             grep -qF 'admin/services/cloudflared' <<< "$CLOUDFLARED_MENU"; then
            echo "::error::Cloudflare Tunnel is not using its upstream VPN menu"
            exit 1
          fi

          SHADOW_CONTENT="$(unsquashfs -cat "$ROOTFS" etc/shadow)"
          grep -q '^root:::' <<< "$SHADOW_CONTENT" || {
            echo "::error::The final Arthur image does not have the expected blank root password"
            exit 1
          }

          # shellcheck disable=SC2016
          FWTOOL_FIXED='if { [ "${devicecompat#.*}" != "${imagecompat#.*}" ] || [ "$dev" = "$oem" ]; } && [ "$SAVE_CONFIG" = "1" ]; then'
          FWTOOL_CONTENT="$(unsquashfs -cat "$ROOTFS" lib/upgrade/fwtool.sh)"
          grep -qF "$FWTOOL_FIXED" <<< "$FWTOOL_CONTENT" || {
            echo "::error::The final Arthur image is missing the fwtool fix"
            exit 1
          }

          NLBWMON_CONFIG="$(unsquashfs -cat "$ROOTFS" etc/config/nlbwmon)"
          grep -qF 'option database_directory /tmp/nlbwmon' <<< "$NLBWMON_CONFIG" || {
            echo "::error::The final Arthur image does not keep nlbwmon data in RAM"
            exit 1
          }

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Check Package Manager
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          if [ -d ./bin/packages ]; then
            if find ./bin/packages/ -name "*.apk" -print -quit | grep -q .; then
              echo "PM_TYPE=apk (切换可能未生效)" >> $GITHUB_ENV
            elif find ./bin/packages/ -name "*.ipk" -print -quit | grep -q .; then
              echo "PM_TYPE=opkg (IPK) ✅" >> $GITHUB_ENV
            else
              echo "PM_TYPE=unknown (bin/packages 存在但无包文件)" >> $GITHUB_ENV
            fi
          else
            # 如果编译产物已被清理，通过 .config 推断
            if grep -qE '^CONFIG_PACKAGE_apk(-mbedtls)?=y' .config 2>/dev/null; then
              echo "PM_TYPE=apk (通过 .config 推断)" >> $GITHUB_ENV
            elif grep -q '^CONFIG_PACKAGE_opkg=y' .config 2>/dev/null; then
              echo "PM_TYPE=opkg (IPK) ✅ (通过 .config 推断)" >> $GITHUB_ENV
            else
              echo "PM_TYPE=unknown (bin/packages 不存在且 .config 无明确配置)" >> $GITHUB_ENV
            fi
          fi
      
      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Upload Test Configuration
        if: always() && env.WRT_TEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: config-${{env.WRT_CONFIG}}-${{env.WRT_HASH}}
          path: ./Config-*.txt
          if-no-files-found: error
          retention-days: 7

      - name: Release Firmware
        if: env.WRT_TEST != 'true'
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}

            WIFI名称：${{env.WRT_SSID}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
            包管理器：${{ env.PM_TYPE }}
